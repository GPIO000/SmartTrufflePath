<!DOCTYPE html>
<html lang="it" class="no-scroll-body">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truffle Mobil Frist</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <!-- Stili integrati per evitare errori 404 su GitHub Pages -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body.no-scroll-body {
            width: 100vw; height: 100vh; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; color: #ffffff;
        }
        #app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        #app-header {
            height: 50px; min-height: 50px; background-color: #1e293b;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000; border-bottom: 1px solid #334155;
        }
        #app-header h1 { font-size: 1.1rem; color: #f8fafc; }
        #menu-toggle-btn { background: none; border: none; color: #ffffff; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        #gps-status-dot { width: 12px; height: 12px; border-radius: 50%; background-color: #ef4444; }
        #map-dashboard { flex: 1; width: 100%; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        #map { flex: 1; width: 100%; z-index: 1; }
        #compass-box {
            position: absolute; top: 10px; left: 10px; right: 65px;
            background: rgba(15, 23, 42, 0.9); border: 1px solid #334155;
            padding: 8px 12px; border-radius: 8px; z-index: 999; font-size: 0.8rem;
            color: #f8fafc; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none;
        }
        #map-overlays {
            position: absolute; bottom: 25px; left: 5px; right: 5px;
            display: flex; gap: 3px; z-index: 999;
        }
        .overlay-btn {
            flex: 1; padding: 10px 2px; background-color: #2563eb; color: white;
            border: none; border-radius: 6px; font-weight: bold; font-size: 0.65rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; cursor: pointer;
        }
        .sos-overlay-btn { background-color: #dc2626; }
        #app-drawer {
            position: fixed; top: 0; left: -100%; width: 80%; max-width: 320px;
            height: 100vh; background-color: #1e293b; z-index: 2000;
            transition: left 0.3s ease-in-out; display: flex; flex-direction: column;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        #app-drawer.drawer-open { left: 0; }
        .drawer-header {
            height: 50px; min-height: 50px; background-color: #0f172a;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; border-bottom: 1px solid #334155;
        }
        .drawer-header h2 { font-size: 1rem; }
        .drawer-header button { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .drawer-content { flex: 1; overflow-y: auto; padding: 15px; }
        .drawer-section { margin-bottom: 20px; }
        .drawer-section h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .drawer-section button {
            display: block; width: 100%; padding: 12px 10px; margin-bottom: 8px;
            background-color: #334155; color: #f8fafc; border: none; border-radius: 6px;
            text-align: left; font-size: 0.9rem; cursor: pointer;
        }
        #drawer-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0,0,0,0.5); z-index: 1500; display: none;
        }
        #drawer-backdrop.active { display: block; }
        #active-module-view {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #0f172a; z-index: 3000; display: none; flex-direction: column; overflow-y: auto;
        }
        .module-header-bar {
            height: 50px; background-color: #1e293b; display: flex; align-items: center;
            padding: 0 15px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10;
        }
        .back-map-btn { background: none; border: none; color: #3b82f6; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .module-body-content { padding: 20px; flex: 1; }
        .module-body-content h2 { font-size: 1.2rem; margin-bottom: 5px; color: #f8fafc; }
        .module-body-content > p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
        .module-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-top: 10px; font-size: 0.9rem; }
        .mod-input { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 12px; background-color: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; }
    </style>
</head>
<body class="no-scroll-body">

    <div id="app-container">
        <!-- Header Superiore (Senza icona del fungo) -->
        <header id="app-header">
            <button id="menu-toggle-btn" onclick="toggleDrawer()">☰</button>
            <h1 id="gps-status-text">Truffle App</h1>
            <div id="gps-status-dot" title="GPS in attesa..."></div>
        </header>

        <!-- Dashboard Mappa e Controlli -->
        <div id="map-dashboard">
            <div id="compass-box">🧭 In attesa di posizione GPS...</div>
            <div id="map"></div>
            
            <!-- Bottoni Overlay con pulsante Elimina Auto e layout flessibile -->
            <div id="map-overlays">
                <button class="overlay-btn" onclick="saveCarPosition()">🚗 Auto</button>
                <button class="overlay-btn" onclick="returnToCar()">🧭 Vai</button>
                <button class="overlay-btn" style="background:#dc2626;" onclick="deleteCarPosition()">🗑️ Del</button>
                <button class="overlay-btn" onclick="savePoiPosition()">📍 Punto</button>
                <button class="overlay-btn" onclick="openModule('poilist')">📋 Elenco</button>
                <button class="overlay-btn sos-overlay-btn" onclick="triggerSOS()">🚨 SOS</button>
            </div>
        </div>
    </div>

    <!-- Menu a Cassetto (Drawer) -->
    <div id="app-drawer">
        <div class="drawer-header">
            <h2>Menu</h2>
            <button onclick="toggleDrawer()">✕</button>
        </div>
        <div class="drawer-content">
            <div class="drawer-section">
                <h3>Normativa & Fisco (Legge 145/2018)</h3>
                <button onclick="openModule('tesserino')">🆔 Anagrafica & Tesserino</button>
                <button onclick="openModule('pagopa')">💳 Ricevuta PagoPA (Tassa)</button>
                <button onclick="openModule('f24')">📄 F24 ELIDE (Imposta 100€)</button>
                <button onclick="openModule('ricevute')">📝 Emetti Ricevuta Vendita</button>
                <button onclick="openModule('storico_ricevute')">📂 Archivio Ricevute</button>
                <button onclick="openModule('bilancio')">📊 Bilancio & Contabilità</button>
            </div>
            <div class="drawer-section">
                <h3>Cane & Sicurezza</h3>
                <button onclick="openModule('canidiary')">🐕 Profilo Cane</button>
                <button onclick="openModule('vet')">💉 Libretto Sanitario</button>
                <button onclick="openModule('vet-emergency')">⚠️ Pronto Soccorso H24</button>
                <button onclick="openModule('emergency')">📞 Chiama 112</button>
            </div>
            <div class="drawer-section">
                <h3>Sistema</h3>
                <button onclick="openModule('export')">💾 Backup & Report CSV</button>
            </div>
        </div>
    </div>
    <div id="drawer-backdrop" onclick="toggleDrawer()"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Script Principale dell'App -->
    <script src="./js/app.js"></script>

    <!-- Registrazione Service Worker per PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato:', reg.scope))
                    .catch(err => console.log('Service Worker fallito:', err));
            });
        }
    </script>
</body>
</html>
