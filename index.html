<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truffle Mobil Frist</title>

    <!-- CSS di Leaflet per la mappa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Il tuo file CSS principale -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="no-scroll-layout">

    <!-- DASHBOARD PRINCIPALE A SCHERMO INTERO (No-Scroll) -->
    <div id="app-dashboard">
        
        <!-- Header di Stato e Conformità (Legge 145/2018 & F24) -->
        <header id="app-header">
            <h1>Truffle Mobil Frist</h1>
            <span id="fiscal-status" class="badge-active">F24 / Reg. CE 178/02 Attivo</span>
        </header>

        <!-- Sezione Principale: Mappa GPS e Navigazione -->
        <section id="map-container">
            <div id="map"></div>
        </section>

        <!-- Pannello Moduli Rapidi (Fiscale, Cani, Tracciabilità) -->
        <section id="quick-modules">
            <button class="mod-btn" onclick="openModule('fiscal')">F24 / Vendita</button>
            <button class="mod-btn" onclick="openModule('canine')">Salute Canina</button>
            <button class="mod-btn" onclick="openModule('traceability')">Tracciabilità</button>
        </section>

        <!-- Barra di Emergenza / SOS GPS -->
        <footer id="emergency-footer">
            <button id="sos-btn" onclick="triggerSOS()">SOS / EMERGENZA GPS</button>
        </footer>

    </div>

    <!-- JavaScript di Leaflet (DEVE essere prima di app.js) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Il tuo file JavaScript principale -->
    <script src="js/app.js"></script>

    <!-- Registrazione del Service Worker per la gestione offline -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log("Service Worker registrato con successo!"))
                .catch((err) => console.log("Errore Service Worker:", err));
        }
    </script>
</body>
</html>
