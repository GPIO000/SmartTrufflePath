<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truffle Mobil Frist</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <!-- Leaflet CSS per la Mappa Offline/Online -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- CONTENITORE PRINCIPALE (Bloccato a schermo intero senza scrolling) -->
    <div id="app-container">

        <!-- HEADER FISSO -->
        <header id="app-header">
            <button id="menu-btn" aria-label="Menu">☰</button>
            <h1>Truffle Mobil Frist</h1>
            <button id="sos-btn" aria-label="Emergenza SOS">🚨 SOS</button>
        </header>

        <!-- DASHBOARD CENTRALE: MAPPA FULLSCREEN -->
        <main id="map-container">
            <div id="map"></div>
        </main>

        <!-- CONTROLLI RAPIDI IN SOVRAPPOSIZIONE (HUD) -->
        <div id="map-hud">
            <button id="btn-car" class="hud-btn">🚗 Ritorno all'Auto</button>
            <button id="btn-find" class="hud-btn">📍 Posizione GPS</button>
        </div>

        <!-- MENU DRAWER LATERALE (Nascosto di default) -->
        <nav id="drawer-menu" class="drawer hidden">
            <div class="drawer-header">
                <h2>Menu Principale</h2>
                <button id="close-drawer">✕</button>
            </div>
            <ul>
                <li data-target="tesserini">🪪 Tesserini & PagoPA</li>
                <li data-target="vendite">🧾 Vendita & F24 ELIDE</li>
                <li data-target="cani">🐕‍🦺 Anagrafica & Cani</li>
                <li data-target="bilancio">💰 Spese & Bilancio</li>
                <li data-target="emergenza">🚨 Emergenza & Soccorso</li>
            </ul>
        </nav>

    </div>

    <!-- Script Leaflet e Logica App -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
