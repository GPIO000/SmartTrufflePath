<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Raccolta Tartufi</title>
    <!-- Inclusione Leaflet CSS per la mappa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app-container" style="position: relative; width: 100vw; height: 100vh;">
        
        <!-- Barra di stato GPS -->
        <div id="gps-status-bar" style="position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.8); padding: 6px 12px; border-radius: 8px; color: white; display: flex; align-items: center; gap: 8px;">
            <span id="gps-status-dot" style="width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444;"></span>
            <span id="gps-status-text" style="font-size: 0.85rem;">GPS Inizializzazione...</span>
        </div>

        <!-- Box Bussola / Navigazione -->
        <div id="compass-box" style="position: absolute; top: 60px; left: 10px; z-index: 1000; background: rgba(15, 23, 42, 0.8); padding: 8px 12px; border-radius: 8px; color: white; font-size: 0.85rem;">
            🧭 Seleziona una destinazione (Auto o Punto)
        </div>

        <!-- Contenitore Mappa -->
        <div id="map" style="width: 100%; height: 100%;"></div>

        <!-- Bottoni di controllo rapidi sulla mappa (Posizionati in sicurezza) -->
        <div style="position: absolute; bottom: 80px; right: 15px; z-index: 1000; display: flex; flex-direction: column; gap: 6px;">
            <button onclick="toggleDrawer()" class="overlay-btn" style="background: #1e293b; padding: 8px 14px; border-radius: 6px; color: white; border: none; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 0.9rem;">☰ Menu</button>
            <button onclick="saveCarPosition()" class="overlay-btn" style="background: #2563eb; padding: 8px 14px; border-radius: 6px; color: white; border: none; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 0.9rem;">🚗 Auto</button>
            <button onclick="returnToCar()" class="overlay-btn" style="background: #16a34a; padding: 8px 14px; border-radius: 6px; color: white; border: none; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 0.9rem;">🧭 Vai all'Auto</button>
            <button onclick="savePoiPosition()" class="overlay-btn" style="background: #d97706; padding: 8px 14px; border-radius: 6px; color: white; border: none; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 0.9rem;">📍 Punto</button>
            <button onclick="centerOnUser()" class="overlay-btn" style="background: #475569; padding: 8px 14px; border-radius: 6px; color: white; border: none; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 0.9rem;">📍 Centra GPS</button>
        </div>

        <!-- Menu a scomparsa (Drawer) corretto e aggiornato -->
        <div id="app-drawer" class="drawer">
            <div class="drawer-header">
                <h2>Menu</h2>
                <button onclick="toggleDrawer()" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            <div class="drawer-content">
                
                <div class="drawer-section">
                    <h3>Mappa & Raccolta</h3>
                    <button onclick="openModule('poilist')">📍 Elenco Punti & Tartufaie</button>
                    <button onclick="openModule('registro_giornaliero')">📖 Registro Giornaliero Ritrovamenti</button>
                </div>

                <div class="drawer-section">
                    <h3>Amministrazione & Contabilità</h3>
                    <!-- Pulsante Tesserino incluso -->
                    <button onclick="openModule('tesserino')">🪪 Anagrafica & Tesserino</button>
                    <button onclick="openModule('pagopa')">💳 Ricevuta PagoPA (Tassa)</button>
                    <button onclick="openModule('f24')">📄 F24 ELIDE (Imposta 100€)</button>
                    <button onclick="openModule('ricevute')">📝 Emetti Ricevuta Vendita</button>
                    <button onclick="openModule('clienti')">👥 Rubrica Clienti</button>
                    <button onclick="openModule('storico_ricevute')">📁 Archivio Ricevute</button>
                    <button onclick="openModule('bilancio')">📊 Bilancio & Contabilità</button>
                </div>

                <div class="drawer-section">
                    <h3>Cane & Sicurezza</h3>
                    <button onclick="openModule('canidiary')">🐕 Profilo Cane</button>
                    <button onclick="openModule('vet')">💉 Libretto Sanitario</button>
                    <button onclick="openModule('vet-emergency')">⚠️ Pronto Soccorso H24</button>
                    <button onclick="openModule('polizze')">🛡️ Polizze & Assicurazioni</button>
                    <button onclick="window.location.href='tel:112'">📞 Chiama 112</button>
                </div>

                <div class="drawer-section">
                    <h3>Sistema</h3>
                    <button onclick="openModule('export')">💾 Backup & Report CSV</button>
                    <button onclick="shareAppUrl()">📦 Condividi App</button>
                </div>

            </div>
        </div>
        <div id="drawer-backdrop" class="backdrop" onclick="toggleDrawer()"></div>

        <!-- Vista Dinamica dei Moduli -->
        <div id="active-module-view" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 2000; overflow-y: auto; padding: 20px; box-sizing: border-box; color: white; flex-direction: column;">
            <!-- Il contenuto viene iniettato dinamicamente via JS tramite openModule() -->
        </div>

    </div>

    <!-- Inclusione Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Inclusione libreria html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Script principale dell'applicazione -->
    <script src="js/app.js"></script>
</body>
</html>
