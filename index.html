<!DOCTYPE html>
<html lang="it" class="no-scroll-body">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truffle Mobil First</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1d271c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <!-- File di Stile Principale (Aggiornato alla cartella CSS) -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="no-scroll-body">

    <div id="app-container">
        <!-- Header Superiore -->
        <header id="app-header">
            <button id="menu-toggle-btn" data-action="toggleDrawer" aria-label="Apri o chiudi il menu">☰</button>
            <h1 id="gps-status-text">Truffle App</h1>
            <div id="gps-status-dot" title="GPS in attesa..."></div>
        </header>

        <!-- Dashboard Mappa e Controlli -->
        <div id="map-dashboard">
            <div id="compass-box">🧭 In attesa di posizione GPS...</div>
            <div id="map"></div>
            
            <!-- Bottoni Overlay rialzati -->
            <div id="map-overlays">
                <button class="overlay-btn btn-sky" data-action="centerOnUser" aria-label="Centra la mappa sulla posizione attuale">🎯 Centra</button>
                <button class="overlay-btn" data-action="saveCarPosition" aria-label="Salva la posizione dell'auto">🚗 Auto</button>
                <button class="overlay-btn" data-action="returnToCar" aria-label="Avvia la navigazione verso l'auto">🧭 Vai</button>
                <button class="overlay-btn btn-danger" data-action="deleteCarPosition" aria-label="Elimina la posizione dell'auto">🗑️ Del</button>
                <button class="overlay-btn" data-action="savePoiPosition" aria-label="Salva un nuovo punto di interesse">📍 Punto</button>
                <button class="overlay-btn" data-action="openModule" data-action-args="[&quot;poilist&quot;]" aria-label="Apri l'elenco dei punti di interesse">📋 Elenco</button>
                <button class="overlay-btn sos-overlay-btn" data-action="triggerSOS" aria-label="Invia un messaggio SOS con la posizione">🚨 SOS</button>
            </div>
        </div>
    </div>

    <!-- Menu a Cassetto (Drawer) -->
    <div id="app-drawer">
        <div class="drawer-header">
            <h2>Menu</h2>
            <button data-action="toggleDrawer" aria-label="Chiudi il menu">✕</button>
        </div>
        <div class="drawer-content">
            <div class="drawer-section">
                <h3>Normativa & Fisco (Legge 145/2018)</h3>
                <button data-action="openModule" data-action-args="[&quot;tesserino&quot;]">🆔 Dati Personali & Tesserino</button>
                <button data-action="openModule" data-action-args="[&quot;pagopa&quot;]">💳 Ricevuta PagoPA (Tassa)</button>
                <button data-action="openModule" data-action-args="[&quot;f24&quot;]">📄 F24 ELIDE (Imposta 100€)</button>
                <button data-action="openModule" data-action-args="[&quot;calendario&quot;]">📅 Calendario Raccolta Tartufi</button>
                <button data-action="openModule" data-action-args="[&quot;archivio&quot;]">📚 Archivio Data raccolta Tartufi per Regione</button>
                <button data-action="openModule" data-action-args="[&quot;registro_giornaliero&quot;]">🍄 Registro Ritrovamenti</button>
                <button data-action="openModule" data-action-args="[&quot;clienti&quot;]">👥 Rubrica Clienti</button>
                <button data-action="openModule" data-action-args="[&quot;ricevute&quot;]">📝 Emetti Ricevuta Vendita</button>
                <button data-action="openModule" data-action-args="[&quot;storico_ricevute&quot;]">📂 Archivio Ricevute</button>
            </div>

            <div class="drawer-section">
                <h3>Contabilità & Spese</h3>
                <button data-action="openModule" data-action-args="[&quot;spese&quot;]">💸 Gestione Spese</button>
                <button data-action="openModule" data-action-args="[&quot;bilancio&quot;]">📊 Bilancio & Contabilità</button>
            </div>

            <div class="drawer-section">
                <h3>Cane & Sicurezza</h3>
                <button data-action="openModule" data-action-args="[&quot;canidiary&quot;]">🐕 Profilo Cane</button>
                <button data-action="openModule" data-action-args="[&quot;vet&quot;]">💉 Libretto Sanitario</button>
                <button data-action="openModule" data-action-args="[&quot;vet-emergency&quot;]">⚠️ Pronto Soccorso H24</button>
                <button data-action="openModule" data-action-args="[&quot;polizze&quot;]">🛡️ Polizze & Assicurazioni</button>
                <button data-action="openModule" data-action-args="[&quot;emergency&quot;]">📞 Chiama 112</button>
            </div>

            <div class="drawer-section">
                <h3>Sistema</h3>
                <button data-action="openModule" data-action-args="[&quot;export&quot;]">💾 Backup & Report CSV</button>
                <button data-action="shareAppUrl">📤 Condividi App</button>
                <button id="btn-installa-app" data-action="installApp">📲 Installa App</button>
            </div>
        </div>
    </div>
    <div id="drawer-backdrop" data-action="toggleDrawer" aria-label="Chiudi il menu"></div>

    <!-- Contenitore viste dinamiche a schermo intero -->
    <div id="active-module-view"></div>

    <!-- Toast container per notifiche non bloccanti -->
    <div id="toast-container"></div>

    <!-- Dialog personalizzato per alert / confirm / prompt -->
    <dialog id="app-dialog">
        <div class="app-dialog-body">
            <p id="app-dialog-message"></p>
            <input type="text" id="app-dialog-input" class="mod-input app-dialog-input-field" style="display:none;" aria-label="Inserisci un valore">
            <div class="app-dialog-actions">
                <button id="app-dialog-cancel" class="overlay-btn btn-neutral" style="display:none;">Annulla</button>
                <button id="app-dialog-ok" class="overlay-btn btn-primary">OK</button>
            </div>
        </div>
    </dialog>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- html2pdf JS (Necessario per la condivisione e il download diretto del PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
